<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豆花｜拍攝補充畫面</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;color:#ecedef;background:#202329}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#252830}.stage[data-bg="day-office"]{background:linear-gradient(90deg,#1119234a,#11192372),url("assets/office-day.png") center/cover no-repeat}.stage[data-bg="night-office"]{background:linear-gradient(90deg,#0d111c55,#0d111c78),url("assets/office-night.png") center/cover no-repeat}.stage[data-bg="home-room"]{background:linear-gradient(90deg,#17191e42,#17191e80),url("assets/home-room.jpg") center/cover no-repeat}.shell{position:absolute;left:var(--phone-x,67%);top:50%;width:414px;height:868px;padding:12px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;background:linear-gradient(145deg,#3b3e45,#111216 54%,#30333a);border-radius:47px;border:1px solid #6b6e72;box-shadow:0 18px 50px #0008,0 0 0 2px #15171b inset}.shell:before{content:"";position:absolute;top:17px;left:50%;transform:translateX(-50%);width:80px;height:17px;border-radius:20px;background:#111216;z-index:4}.phone{width:390px;height:844px;border-radius:34px;background:#24262e;overflow:hidden;display:flex;flex-direction:column;position:relative}.statusbar{height:38px;padding:0 22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;flex:none}.status-icons{display:flex;align-items:center;gap:4px}.status-icons span{display:block;width:15px;height:8px;border-radius:3px;background:#d9dde1}.header{height:72px;padding:13px 20px;display:flex;align-items:center;gap:17px;border-bottom:1px solid #ffffff0c;flex:none}.back{font-size:30px;font-weight:200;color:#b9bdc7}.header strong{font-size:17px;font-weight:600}.header small{display:block;font-size:11px;color:#949aa4;margin-top:3px}.body{flex:1;overflow:hidden;position:relative;padding:28px 18px}.eyebrow{font-size:11px;letter-spacing:.09em;color:#969da8;margin-bottom:11px}.card{background:#30343c;border-radius:20px;padding:19px;margin-bottom:14px}.card h1{font-size:22px;font-weight:550;margin:3px 0 16px}.card p{font-size:13px;color:#b8bec6;line-height:1.7;margin:8px 0}.item{display:flex;align-items:center;justify-content:space-between;padding:15px 1px;border-top:1px solid #ffffff12;font-size:14px}.item small{color:#a0a7af;font-size:12px}.item b{font-size:13px;font-weight:500;color:#d9e7d3}.done{font-size:12px;color:#c4d6c5;margin-top:14px}.chat-date{text-align:center;margin:10px auto 24px}.chat-date span{border-radius:30px;background:#373a43;padding:6px 14px;font-size:11px;color:#aeb3bb}.bubble{max-width:75%;padding:12px 15px;border-radius:18px 18px 18px 7px;background:#373a43;font-size:14px;line-height:1.55}.meta{font-size:11px;color:#8f949e;margin-top:6px}.composer{height:68px;display:flex;gap:11px;align-items:center;padding:8px 15px 16px;border-top:1px solid #ffffff0c}.composer .plus{font-size:25px;color:#b5bac2}.composer input{background:#343741;color:#f0f1f3;border:0;border-radius:22px;height:38px;flex:1;min-width:0;padding:0 14px;font:14px inherit;outline:none}.composer .send{color:#cadbbd;background:#3d443c;border-radius:11px;padding:8px 10px;font-size:12px}.notice{background:#333741;border:1px solid #ffffff1d;border-radius:19px;padding:16px 17px;box-shadow:0 8px 24px #0002;transition:transform .48s ease,opacity .48s ease}.notice.dismissed{transform:translateY(-145px);opacity:0}.notice-top{display:flex;justify-content:space-between;align-items:center;color:#aab2bd;font-size:11px}.notice h1{font-size:16px;font-weight:570;margin:13px 0 6px}.notice p{font-size:13px;color:#c9cdd2;margin:0}.notice-foot{font-size:12px;color:#8993a0;margin-top:17px}.center-message{position:absolute;left:18px;right:18px;top:31%;text-align:center}.center-message .icon{width:58px;height:58px;border-radius:19px;background:#343c3d;color:#c4d8c5;display:grid;place-items:center;margin:0 auto 23px;font-size:26px}.center-message .label{color:#aab2bc;font-size:12px;letter-spacing:.1em}.center-message h1{font-size:23px;font-weight:530;margin:16px 0 10px}.center-message p{color:#aeb5bc;font-size:13px;line-height:1.65}.black{position:absolute;inset:0;background:#050608;z-index:8;display:none}.black.active{display:block}.hidden{display:none!important}
</style></head><body><main class="stage" id="stage"><div class="shell"><div class="phone" id="phone"><div class="statusbar"><span id="clock">09:18</span><span class="status-icons" aria-label="訊號與電量"><span></span><span></span></span></div><div class="header"><span class="back">‹</span><div><strong id="title">豆花</strong><small id="subtitle">生活協助</small></div></div><div class="body" id="body"></div><div class="composer hidden" id="composer"><span class="plus">＋</span><input id="draftInput" placeholder="輸入訊息" autocomplete="off"><span class="send">送出</span></div><div class="black" id="screenOff" aria-label="手機螢幕黑屏"></div></div></div></main><script>
const p=new URLSearchParams(location.search),shot=p.get('shot')||'order',stage=document.getElementById('stage'),body=document.getElementById('body'),title=document.getElementById('title'),subtitle=document.getElementById('subtitle'),composer=document.getElementById('composer'),screenOff=document.getElementById('screenOff');stage.style.setProperty('--phone-x',p.get('layout')==='center'?'50%':'67%');stage.dataset.bg=p.get('bg')||(['draft','order','family-detect','family-done'].includes(shot)?'home-room':'night-office');function fit(){stage.style.setProperty('--scale',stage.getBoundingClientRect().height*.89/868)}fit();addEventListener('resize',fit);
if(shot==='order'){document.getElementById('clock').textContent='09:02';title.textContent='豆花';subtitle.textContent='生活協助';body.innerHTML='<div class="eyebrow">訂購紀錄 · 10月25日</div><div class="card"><h1>已為阿芬準備好</h1><div class="item"><span>晚餐食材 <small>家常菜</small></span><b>2 人份</b></div><div class="item"><span>小蛋糕</span><b>× 1</b></div><div class="done">訂購完成 · 預計傍晚送達</div></div>'}
if(shot==='draft'){document.getElementById('clock').textContent='17:42';title.textContent='雅婷';subtitle.textContent='聊天';body.innerHTML='<div class="chat-date"><span>10月25日（四）</span></div><div class="bubble">媽，生日快樂 ♡<br>我今天忙完就回去。</div><div class="meta">08:45</div>';composer.classList.remove('hidden')}
if(shot==='notice'){document.getElementById('clock').textContent='19:35';title.textContent='通知';subtitle.textContent='今天';body.innerHTML='<div class="eyebrow">豆花 · 每日照護</div><div class="notice" id="notice"><div class="notice-top"><span>豆花 · 今日照護報告</span><span>剛剛</span></div><h1>媽媽今日狀態：一切正常</h1><p>本週連續 7 天正常</p><div class="notice-foot">今日照護項目已完成</div></div>'}
if(shot==='family-detect'||shot==='family-done'){document.getElementById('clock').textContent='23:41';title.textContent='豆花';subtitle.textContent='家庭互動';body.innerHTML=`<div class="center-message"><div class="icon">✦</div><div class="label">今日互動</div><h1>${shot==='family-detect'?'家庭互動偵測中':'不需要協助'}</h1><p>${shot==='family-detect'?'阿芬正在與家人相處。':'家人正在陪伴阿芬。'}</p></div>`}
screenOff.addEventListener('click',()=>screenOff.classList.remove('active'));addEventListener('keydown',e=>{if(e.key.toLowerCase()==='b'&&e.target.tagName!=='INPUT')screenOff.classList.toggle('active')});window.dismissNotice=()=>document.getElementById('notice')?.classList.add('dismissed');window.blackPhone=()=>screenOff.classList.add('active');window.wakePhone=()=>screenOff.classList.remove('active');
</script></body></html>
